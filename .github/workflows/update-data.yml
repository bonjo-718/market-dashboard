name: Update market data

on:
  schedule:
    - cron: "15 23 * * *"     # every day at 23:15 UTC (~7:15 pm ET), after US market close
  workflow_dispatch:          # lets you run it by hand from the Actions tab

permissions:
  contents: write             # the job needs to commit data.json back to the repo

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch prices
        run: python fetch_data.py

      - name: Commit data.json
        run: |
          git config user.name "market-data-bot"
          git config user.email "market-data-bot@users.noreply.github.com"
          git add data.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update market data $(date -u +%Y-%m-%d)"
            git push
          fi
